name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v

      - name: Verify no secrets in source
        run: |
          # Fail if any source file contains patterns that look like real API keys
          # This is a simple grep-based check — not a substitute for proper secret scanning
          ! grep -r "sk-[a-zA-Z0-9]\{40,\}" src/ tests/ || (echo "Possible OpenAI key in source!" && exit 1)
          ! grep -r "AC[a-f0-9]\{32\}" src/ tests/ || (echo "Possible Twilio SID in source!" && exit 1)
          echo "No obvious secrets found in source."

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff
        run: ruff check src/ tests/ --output-format=github

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r src/ \
            -ll \
            --exclude src/__init__.py \
            -f txt
